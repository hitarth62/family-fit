name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Keep the same signing key so updates keep your data
        run: mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: app
        run: |
          npm install
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyFit-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
